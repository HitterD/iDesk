<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iDesk mockup — Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<link rel="stylesheet" href="idesk.css?v=20">
<link rel="stylesheet" href="pages.css?v=20">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="dropdown.js?v=20"></script>
<script src="mock-state.js?v=20"></script>
<script src="shell.js?v=20"></script>
<script src="motion.js?v=20"></script>
<script src="pages.js?v=20"></script>
</head>
<body data-page="kb" data-crumb="Resources" data-title="Knowledge Base">
<!-- Production source: apps/frontend/src/features/knowledge-base/pages/BentoKnowledgeBasePage.tsx, components/KnowledgeBaseLanding.tsx,
     components/TopicGrid.tsx, components/ui/ArticleListRow.tsx + ArticleCard.tsx (category meta) -->
<script>
const { ic } = iDeskPages;
const TOPICS = { Network: ['wifi', 'var(--blue)'], Security: ['shield', 'var(--red)'], Email: ['mail', 'var(--teal)'], Hardware: ['monitor', 'var(--orange)'], Software: ['app-window', 'var(--navy)'], 'Access & Forms': ['file-key-2', 'var(--mint)'], General: ['book-open', 'var(--brown)'] };
// Synthetic sample data: [title, category, views, updated (days ago), excerpt]
const ARTICLES = [
  ['Cara menghubungkan VPN FortiClient dari rumah', 'Network', 1284, 3, 'Instalasi, login, dan solusi saat koneksi terputus.'],
  ['WiFi kantor tidak muncul di laptop', 'Network', 962, 12, 'Cek adapter, lupakan jaringan, lalu sambungkan ulang.'],
  ['Mengatur Outlook di HP Android dan iPhone', 'Email', 877, 6, 'Tambah akun @kapalapi.co.id di aplikasi Outlook.'],
  ['Printer tidak mencetak atau kertas nyangkut', 'Hardware', 731, 1, 'Langkah cepat sebelum membuat tiket servis printer.'],
  ['Reset password Oracle / gagal login K2', 'Access & Forms', 655, 20, 'Ajukan reset lewat iDesk dan cek role setelah aktif.'],
  ['Mengenali email phishing', 'Security', 512, 30, 'Ciri-ciri, contoh, dan apa yang harus dilakukan.'],
  ['Excel lambat saat membuka file besar', 'Software', 433, 9, 'Matikan add-in dan perbaiki instalasi Office.'],
  ['Cara membuat tiket bantuan yang jelas', 'General', 390, 45, 'Judul, detail, dan lampiran yang membantu tim IT.'],
];
let state = { topic: null, sort: 'popular', q: '' };
function visible() {
  const q = state.q.toLowerCase();
  const rows = ARTICLES.filter((a) => (!state.topic || a[1] === state.topic) && (!q || (a[0] + a[4] + a[1]).toLowerCase().includes(q)));
  return [...rows].sort((a, b) => (state.sort === 'popular' ? b[2] - a[2] : a[3] - b[3]));
}
const ago = (d) => (d === 0 ? 'hari ini' : d < 7 ? `${d} hari lalu` : d < 30 ? `${Math.round(d / 7)} minggu lalu` : `${Math.round(d / 30)} bulan lalu`);
function render() {
  const rows = visible();
  document.querySelectorAll('.topic').forEach((t) => { const on = t.dataset.topic === state.topic; t.classList.toggle('on', on); t.setAttribute('aria-pressed', String(on)); });
  const filtered = state.topic || state.q;
  const head = document.getElementById('kbHead');
  head.replaceChildren();
  if (filtered) {
    const back = iDeskDropdown.node('button', 'back'); back.setAttribute('aria-label', 'Kembali ke semua topik'); back.append(iDeskDropdown.icon('x')); back.onclick = reset;
    const h = iDeskDropdown.node('h3', '', state.q ? `“${state.q}”${state.topic ? ` di ${state.topic}` : ''}` : state.topic);
    head.append(back, h, iDeskDropdown.node('span', 'muted', `${rows.length} hasil`));
  } else head.append(iDeskDropdown.node('h3', '', state.sort === 'popular' ? 'Artikel populer' : 'Artikel terbaru'));
  const list = document.getElementById('kbList');
  list.innerHTML = rows.map(([t, c, v, d, ex]) => `<a class="art" href="kb-article.html"><span class="ring" style="--c:${TOPICS[c][1]}">${ic(TOPICS[c][0])}</span><div><b>${t}</b><small><em>${c}</em> · ${ex}</small><small>${v.toLocaleString('id-ID')} views · diperbarui ${ago(d)}</small></div>${ic('chevron-right')}</a>`).join('');
  document.getElementById('kbEmpty').hidden = rows.length > 0;
  document.getElementById('kbEmptyTitle').textContent = state.q ? 'Panduan tidak ditemukan' : 'Belum ada panduan di topik ini';
  list.hidden = rows.length === 0;
  lucide.createIcons();
}
function reset() { state = { ...state, topic: null, q: '' }; document.getElementById('kbq').value = ''; render(); }

iDeskPages.mount(`
<main class="content page">
  <div class="head" style="margin-bottom:0"><span class="spacer"></span>
    <div class="head-actions"><button class="btn" data-demo="Halaman kelola artikel belum dibuat di mockup.">${ic('settings-2')}Kelola</button><button class="btn" data-demo="Editor artikel belum dibuat di mockup.">${ic('file-plus-2')}Buat Artikel</button></div></div>
  <section class="kb-hero">
    <h2>Pusat Panduan</h2>
    <p>Cari solusi mandiri untuk kendala IT sehari-hari. Jika belum ketemu, buat tiket dan tim kami membantu.</p>
    <label class="field">${ic('search')}<input id="kbq" placeholder="Cari panduan, misal VPN, WiFi, Outlook" aria-label="Cari artikel panduan"></label>
  </section>
  <nav class="topics" aria-label="Topik panduan">${Object.entries(TOPICS).map(([n, [i, c]]) => `<button class="topic" data-topic="${n}" aria-pressed="false"><span class="ring" style="--c:${c}">${ic(i)}</span>${n}</button>`).join('')}</nav>
  <section class="kb-list" aria-label="Daftar artikel">
    <div class="bar"><span id="kbHead" style="display:flex;align-items:center;gap:8px;min-width:0"></span><span class="spacer"></span>
      <div class="seg" role="radiogroup" aria-label="Urutkan artikel" id="kbSort"><button data-sort="popular" class="on" role="radio" aria-checked="true">Populer</button><button data-sort="recent" role="radio" aria-checked="false">Terbaru</button></div></div>
    <div class="table" id="kbList"></div>
    <div class="empty-state show" id="kbEmpty" hidden style="background:var(--fill);border-radius:var(--r-card)"><div class="ic">${ic('search-x')}</div><b id="kbEmptyTitle">Panduan tidak ditemukan</b>Coba kata kunci lain, atau lihat semua topik.<br><button class="btn plain" style="margin-top:8px" id="kbReset">Lihat semua topik</button></div>
  </section>
  <section class="help-card">
    <div class="ic">${ic('headphones')}</div>
    <h3>Masih butuh bantuan?</h3>
    <p>Tim IT Helpdesk siap membantu. Buat tiket dan kami akan menindaklanjuti.</p>
    <a class="text-link" href="new.html">Buat tiket${ic('arrow-right')}</a>
    <small>Rata-rata respon IT &lt; 15 menit · Operasional 08:00–17:00 WIB</small>
  </section>
</main>`);
document.querySelector('.topics').addEventListener('click', (e) => { const t = e.target.closest('.topic'); if (!t) return; state = { ...state, topic: state.topic === t.dataset.topic ? null : t.dataset.topic }; render(); });
document.getElementById('kbq').addEventListener('input', (e) => { state = { ...state, q: e.target.value.trim() }; render(); });
document.getElementById('kbReset').onclick = reset;
document.getElementById('kbSort').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#kbSort button').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', String(x === b)); }); state = { ...state, sort: b.dataset.sort }; render(); });
render();
</script>
</body>
</html>
