<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iDesk mockup — Artikel Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<link rel="stylesheet" href="idesk.css?v=15">
<link rel="stylesheet" href="pages.css?v=15">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="dropdown.js?v=15"></script>
<script src="mock-state.js?v=15"></script>
<script src="shell.js?v=15"></script>
<script src="motion.js?v=15"></script>
<script src="pages.js?v=15"></script>
</head>
<body data-page="kb" data-crumb="Knowledge Base" data-title="Cara menghubungkan VPN FortiClient">
<!-- Production source: apps/frontend/src/features/knowledge-base/pages/BentoArticleDetailPage.tsx, components/ArticleMarkdownViewer.tsx, ArticleViewersStack.tsx -->
<script>
const { ic, av } = iDeskPages;
const STEPS = ['Unduh dan pasang FortiClient VPN', 'Tambahkan koneksi kantor', 'Login dengan akun domain', 'Jika koneksi terputus'];
const slug = (i) => `langkah-${i + 1}`;
iDeskPages.mount(`
<main class="content page">
  <div class="article">
    <article class="doc">
      <div class="crumbline"><a href="kb.html" class="text-link" style="font-weight:550">Knowledge Base</a>${ic('chevron-right')}<span style="font-weight:600;color:var(--text-2)">Network</span></div>
      <div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <h2 style="flex:1;min-width:260px">Cara menghubungkan VPN FortiClient dari rumah</h2>
        <div class="head-actions" style="width:auto;margin-top:12px">
          <button class="icon-btn" aria-label="Salin tautan artikel" id="copyLink" style="background:var(--fill)">${ic('link')}</button>
          <button class="btn" data-demo="Cetak / simpan PDF hanya contoh di mockup.">${ic('printer')}Cetak</button>
          <button class="btn" data-demo="Editor artikel belum dibuat di mockup.">${ic('pencil')}Edit</button>
        </div>
      </div>
      <div class="by"><span class="bub" style="--c:var(--blue);--ink:var(--text-2)">${ic('wifi')}Network</span><span>Ditulis oleh <b style="color:var(--text-2)">Tim IT Helpdesk</b></span><span>·</span><span>Diperbarui 18 Okt 2026</span><span>·</span><span>1.284 views</span>
        <span style="display:inline-flex;margin-left:auto">${['Nur Ayni', 'Shanon Maria', 'Yusuf Wijaya'].map((n) => av(n, 'sm')).join('')}</span><small>3 rekan sedang membaca</small></div>
      <div class="prose">
        <p style="margin-top:18px">VPN dipakai untuk mengakses Oracle, K2, folder Synology, dan aplikasi internal dari luar jaringan kantor. Akses VPN harus disetujui lebih dulu lewat <a class="text-link" href="eform.html" style="display:inline">E-Form Access</a>.</p>
        <div class="callout">${ic('triangle-alert')}<div><b>Sebelum mulai:</b> pastikan pengajuan E-Form VPN Anda berstatus <b>Akses Siap</b> dan masa berlakunya belum habis.</div></div>
        <h3 id="${slug(0)}">Langkah 1: ${STEPS[0]}</h3>
        <ol><li>Buka Portal Software ICT dan unduh <code>FortiClientVPN.exe</code>.</li><li>Jalankan installer, pilih <b>VPN only</b>, lalu selesaikan instalasi.</li></ol>
        <h3 id="${slug(1)}">Langkah 2: ${STEPS[1]}</h3>
        <p>Pilih <b>Configure VPN</b>, isi nama koneksi <code>Kantor-SPJ</code>, dan alamat gateway yang dikirim ICT lewat email persetujuan.</p>
        <h3 id="${slug(2)}">Langkah 3: ${STEPS[2]}</h3>
        <p>Masukkan username domain (tanpa <code>@kapalapi.co.id</code>) dan kata sandi komputer kantor. Kode OTP dikirim ke aplikasi authenticator Anda.</p>
        <h3 id="${slug(3)}">Langkah 4: ${STEPS[3]}</h3>
        <ul><li>Pastikan internet rumah stabil; coba buka situs lain lebih dulu.</li><li>Putuskan lalu sambungkan ulang. Jika muncul <code>Credential or SSLVPN configuration is wrong</code>, kata sandi domain mungkin sudah kedaluwarsa.</li></ul>
      </div>
      <div class="tags">Topik Terkait:<span class="tag">vpn</span><span class="tag">forticlient</span><span class="tag">remote</span></div>
      <div class="feedback" id="feedback">
        <div><b>Apakah panduan ini membantu?</b><small>42 rekan kerja merasa terbantu dengan panduan ini.</small></div>
        <button class="btn" data-vote="yes">${ic('thumbs-up')}Ya, Membantu</button><button class="btn" data-vote="no">${ic('thumbs-down')}Belum</button>
      </div>
    </article>
    <aside class="stack" style="position:sticky;top:72px">
      <section class="panel"><h3>Progres Solusi <small id="progLabel">0 / ${STEPS.length}</small></h3>
        <div class="meter" style="--c:var(--green);margin-bottom:6px"><i id="progBar" style="--p:0%"></i></div>
        <div class="steps-check">${STEPS.map((s, i) => `<label><input type="checkbox" data-step="${i}">Langkah ${i + 1}: ${s}</label>`).join('')}</div></section>
      <section class="panel"><h3>Daftar Isi</h3><nav class="toc">${STEPS.map((s, i) => `<a href="#${slug(i)}">${i + 1}. ${s}</a>`).join('')}</nav></section>
      <section class="panel"><h3>Butuh Bantuan Langsung?</h3><p class="panel-sub" style="margin:0 0 8px">Jika langkah di atas belum berhasil, tim IT siap membantu.</p><a class="text-link" href="new.html">Buat Tiket Bantuan${ic('arrow-right')}</a></section>
    </aside>
  </div>
</main>`);
const boxes = [...document.querySelectorAll('[data-step]')];
boxes.forEach((b) => b.addEventListener('change', () => {
  const n = boxes.filter((x) => x.checked).length;
  document.getElementById('progLabel').textContent = `${n} / ${STEPS.length}`;
  document.getElementById('progBar').style.setProperty('--p', `${(n / STEPS.length) * 100}%`);
}));
document.getElementById('copyLink').onclick = () => iDeskDropdown.notice('Tautan artikel contoh tidak disalin; mockup tidak memiliki URL produksi.');
document.getElementById('feedback').addEventListener('click', (e) => {
  const b = e.target.closest('[data-vote]'); if (!b) return;
  document.querySelectorAll('[data-vote]').forEach((x) => { x.disabled = true; x.style.opacity = x === b ? '1' : '.5'; });
  iDeskDropdown.notice(b.dataset.vote === 'yes' ? 'Terima kasih! Penilaian contoh tidak dikirim ke server.' : 'Terima kasih atas masukannya. Penilaian contoh tidak dikirim ke server.');
});
</script>
</body>
</html>
