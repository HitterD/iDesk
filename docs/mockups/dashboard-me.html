<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iDesk mockup — Dashboard Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<link rel="stylesheet" href="idesk.css?v=16">
<link rel="stylesheet" href="pages.css?v=16">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="dropdown.js?v=16"></script>
<script src="mock-state.js?v=16"></script>
<script src="shell.js?v=16"></script>
<script src="motion.js?v=16"></script>
<script src="pages.js?v=16"></script>
</head>
<body data-page="dashboard-me" data-crumb="Dashboard" data-title="Dashboard Saya">
<!-- Production source: apps/frontend/src/features/dashboard/agent/AgentDashboardPage.tsx, AgentDashboardWidgets.tsx, AgentTrendChart.tsx, components/MyRatingCard.tsx -->
<script>
const { ic, bub, lines } = iDeskPages;
const PERIODS = [7, 30, 90];
const DEFAULT_PERIOD = 30;
const PRI_DOT = { CRITICAL: 'var(--red)', HIGH: 'var(--orange)', MEDIUM: 'var(--blue)', LOW: 'var(--gray)' };
// Synthetic sample data, per period
const SAMPLE = {
  7: { resolved: 9, avg: '3j 40m', sla: 92, assigned: [3, 2, 4, 1, 3, 2, 2], done: [2, 1, 3, 2, 2, 0, 1] },
  // 30 and 90 days are weekly totals: daily counts of 1–4 tickets read as noise, weekly totals read as a trend
  30: { resolved: 41, avg: '4j 12m', sla: 88, weekly: true, assigned: [8, 10, 9, 11, 9], done: [7, 9, 8, 10, 7] },
  90: { resolved: 118, avg: '4j 50m', sla: 85, weekly: true, assigned: [9, 11, 8, 12, 10, 9, 13, 11, 10, 12, 9, 8, 11], done: [8, 10, 9, 10, 9, 10, 11, 10, 11, 10, 9, 9, 10] },
};
const WEEK_STARTS_30 = ['22 Sep', '29 Sep', '6 Okt', '13 Okt', '20 Okt'];
const Y_TICKS = 4;
const Y_TICKS_FEW = 2;
const ATTENTION = [
  { id: '181026-PRO-0009', t: 'Printer label gudang mati total', p: 'CRITICAL', s: 'In Progress', sla: 'Lewat 1j 40m', over: true },
  { id: '191026-GA-0002', t: 'Email tidak bisa diakses', p: 'HIGH', s: 'In Progress', sla: 'Sisa 1j 11m' },
  { id: '201026-HC-0003', t: 'Wifi di PC tidak muncul', p: 'MEDIUM', s: 'Waiting Vendor', sla: 'Dijeda' },
  { id: '191026-QC-0009', t: 'Kebutuhan kabel type A to B', p: 'MEDIUM', s: 'Open', sla: 'Sisa 2h 8j' },
  { id: '141026-HSE-0026', t: 'Kendala UPS ruang server HSE', p: 'LOW', s: 'Waiting Vendor', sla: 'Dijeda' },
];
const INSTALLS = [['Hari ini', 'Instalasi PC baru · Finance lt. 2', '13.30'], ['Hari ini', 'Pasang printer Marketing 42', '15.00'], ['Besok', 'Ganti monitor HR57', '09.00']];
const FEEDBACK = [['Nur Ayni', 5, 'Cepat sekali ditangani, printer langsung normal.'], ['Yanuar Ari Widodo', 4, 'Dijelaskan dengan sabar, terima kasih.']];

const stars = (n) => `<span class="stars" aria-label="${n} dari 5">${Array.from({ length: n }, () => ic('star')).join('')}</span>`;
const FEW_TICKS_MAX = 5; // small counts: 0 / mid / max instead of one gridline per ticket
const trendLabels = (days, n) => (days === 7 ? Array.from({ length: n }, (_, i) => `${15 + i} Okt`)
  : days === 30 ? WEEK_STARTS_30 : Array.from({ length: n }, (_, i) => `Mg ${i + 1}`));
const trendSub = (days) => `Tiket ditugaskan vs diselesaikan per ${SAMPLE[days].weekly ? 'minggu' : 'hari'}`;
function trend(days) {
  const d = SAMPLE[days];
  const top = Math.max(...d.assigned, ...d.done);
  const ticks = top <= FEW_TICKS_MAX ? Y_TICKS_FEW : Y_TICKS;
  const max = Math.ceil((top * 1.1) / ticks) * ticks; // headroom above the peak, round gridline values
  return lines({ labels: trendLabels(days, d.assigned.length), sparse: d.assigned.length > 10, smooth: true, ticks, max,
    label: 'Tren tiket ditugaskan vs diselesaikan',
    series: [{ name: 'Ditugaskan', c: 'var(--blue)', data: d.assigned }, { name: 'Diselesaikan', c: 'var(--green)', data: d.done }] });
}
function perf(days) {
  const d = SAMPLE[days];
  return `<div class="metric" style="--c:var(--green)"><span class="ico">${ic('circle-check')}</span><div>Total selesai</div><b>${d.resolved}</b></div>
    <div class="metric" style="--c:var(--blue)"><span class="ico">${ic('calendar-clock')}</span><div>Rata-rata penyelesaian</div><b>${d.avg}</b></div>
    <div class="metric" style="--c:var(--orange)"><span class="ico">${ic('award')}</span><div>Poin appraisal</div><b>146</b></div>`;
}

iDeskPages.mount(`
<main class="content page dash">
  <div class="head">
    <div><h2>Selamat siang, RM Bagastyo</h2><p>Ada 5 tiket aktif, 1 di antaranya lewat SLA.</p>
      <p class="meta">Agent Operational · Lingkup IT Support · SPJ · diperbarui 21 Okt 2026, 12.40 WIB</p></div>
    <span class="spacer"></span>
    <div class="head-actions">
      <div class="seg" id="period" role="group" aria-label="Periode">${PERIODS.map((p) => `<button data-days="${p}" class="${p === DEFAULT_PERIOD ? 'on' : ''}" aria-pressed="${p === DEFAULT_PERIOD}">${p} hari</button>`).join('')}</div>
      <button class="icon-btn" id="reload" aria-label="Muat ulang" style="background:var(--surface);box-shadow:var(--shadow-1)">${ic('refresh-cw')}</button>
    </div>
  </div>

  <section class="stats four" aria-label="Ringkasan">
    <a class="stat" href="list.html" style="--c:var(--blue);--ink:var(--text)"><span class="top"><span class="ic">${ic('inbox')}</span><span class="n">5</span></span><span class="name">Tiket aktif</span><span class="sub">1 open · 2 dikerjakan · 2 tunggu vendor</span></a>
    <a class="stat attn" href="list.html" style="--c:var(--red);--ink:var(--ink-red)"><span class="top"><span class="ic">${ic('triangle-alert')}</span><span class="n">1</span></span><span class="name">Lewat SLA</span><span class="sub">Segera tindak lanjuti</span></a>
    <a class="stat" href="list.html" style="--c:var(--green);--ink:var(--text)"><span class="top"><span class="ic">${ic('circle-check')}</span><span class="n">3</span></span><span class="name">Selesai hari ini</span><span class="sub">9 minggu ini · 41 bulan ini</span></a>
    <div class="stat" style="--c:var(--navy);--ink:var(--text)"><span class="top"><span class="ic">${ic('gauge')}</span><span class="n" id="slaN">88%</span></span><span class="name">Kepatuhan SLA</span><span class="sub" id="slaLabel">30 hari terakhir</span></div>
  </section>

  <div class="dgrid">
    <div class="stack s8">
      <section class="panel" aria-label="Perlu perhatian">
        <h3>Perlu perhatian <a class="link-more" href="list.html">Lihat semua${ic('chevron-right')}</a></h3>
        <div class="list attn-list" id="attention">${ATTENTION.map((t) => `<a class="li" href="ticket.html">
          <span class="pdot" style="--c:${PRI_DOT[t.p]}" title="Prioritas"></span>
          <div class="grow1"><b>${t.t}</b><small class="mono">#${t.id} · ${t.s}</small></div>
          ${t.over ? bub(t.sla, 'var(--red)', { icon: 'triangle-alert', ink: 'var(--ink-red)' }) : t.sla === 'Dijeda' ? bub('Dijeda', 'var(--orange)', { icon: 'pause', ink: 'var(--ink-orange)' }) : bub(t.sla, 'var(--blue)', { icon: 'timer', mono: true })}
          ${ic('chevron-right')}</a>`).join('')}</div>
      </section>
      <section class="panel fill" aria-label="Tren tiket">
        <h3>Tren tiket <small id="trendSub">30 hari terakhir</small></h3>
        <p class="panel-sub" id="trendDesc">${trendSub(DEFAULT_PERIOD)}</p>
        <div id="trend" class="chart-host">${trend(DEFAULT_PERIOD)}</div>
      </section>
    </div>
    <div class="stack s4">
      <section class="panel" aria-label="Performa"><h3 id="perfTitle">Performa 30 hari</h3><div id="perf">${perf(DEFAULT_PERIOD)}</div></section>
      <section class="panel" aria-label="Workload & Instalasi">
        <h3>Workload &amp; Instalasi</h3>
        <div class="metric" style="--c:var(--navy)"><span class="ico">${ic('wrench')}</span><div>Poin workload hari ini</div><b>6</b></div>
        <p class="sub-head">Jadwal instalasi hari ini &amp; besok</p>
        <div class="list">${INSTALLS.map(([d, t, h]) => `<a class="li" href="hardware.html?tab=calendar"><span class="bub when" style="--c:${d === 'Hari ini' ? 'var(--accent)' : 'var(--gray)'};--ink:${d === 'Hari ini' ? 'var(--accent)' : 'var(--text-2)'}">${d}</span><div class="grow1"><b>${t}</b></div><span class="date">${h}</span></a>`).join('')}</div>
      </section>
      <section class="panel" aria-label="Rating Saya">
        <h3>Rating Saya</h3>
        <div class="rate-sum"><b>4,8</b>${stars(5)}<small>23 penilaian</small></div>
        <p class="panel-sub" style="margin:0 0 8px">Kesan &amp; saran terbaru</p>
        ${FEEDBACK.map(([n, s, q]) => `<div class="quote"><b>${n} ${stars(s)}</b>${q}</div>`).join('')}
      </section>
    </div>
  </div>
</main>`);

const seg = document.getElementById('period');
seg.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-days]'); if (!b) return;
  const days = Number(b.dataset.days);
  seg.querySelectorAll('button').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
  const d = SAMPLE[days];
  document.getElementById('trend').innerHTML = trend(days);
  document.getElementById('perf').innerHTML = perf(days);
  document.getElementById('perfTitle').textContent = `Performa ${days} hari`;
  document.getElementById('trendSub').textContent = `${days} hari terakhir`;
  document.getElementById('trendDesc').textContent = trendSub(days);
  document.getElementById('slaLabel').textContent = `${days} hari terakhir`;
  document.getElementById('slaN').textContent = `${d.sla}%`;
  lucide.createIcons();
});
document.getElementById('reload').onclick = () => {
  const host = document.getElementById('attention');
  const keep = host.innerHTML;
  iDeskPages.skeletonList(host, ATTENTION.length);
  setTimeout(() => { host.innerHTML = keep; lucide.createIcons(); iDeskDropdown.notice('Tampilan contoh diperbarui. Tidak ada pengambilan data server.'); }, 520);
};
</script>
</body>
</html>
