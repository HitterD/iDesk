<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iDesk mockup — Zoom Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<link rel="stylesheet" href="idesk.css?v=15">
<link rel="stylesheet" href="pages.css?v=15">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="dropdown.js?v=15"></script>
<script src="mock-state.js?v=15"></script>
<script src="shell.js?v=15"></script>
<script src="motion.js?v=15"></script>
<script src="pages.js?v=15"></script>
</head>
<body data-page="zoom" data-crumb="Resources" data-title="Zoom Calendar">
<!-- Production source: apps/frontend/src/features/zoom-booking/pages/ZoomCalendarPage.tsx, components/ZoomCalendarHeader.tsx,
     ZoomWeekView.tsx, ZoomAccountsMatrix.tsx, UpcomingMeetingsPanel.tsx, ZoomMyBookingsView.tsx -->
<script>
const { ic, caret, bub } = iDeskPages;
const START_HOUR = 8, SLOTS = 18, SLOT_PX = 30, SLOT_MIN = 30;
const ACC = { A: ['Zoom 1', 'var(--blue)'], B: ['Zoom 2', 'var(--teal)'], C: ['Zoom 3', 'var(--orange)'] };
const DAYS = [['Sen', 19], ['Sel', 20], ['Rab', 21], ['Kam', 22], ['Jum', 23]];
const TODAY = 2;
// Synthetic sample data: [day, start "HH:MM", minutes, title, account, bookedBy, mine]
const BOOKINGS = [
  [0, '09:00', 60, 'Weekly ICT', 'A', 'RM Bagastyo Anggoro', true], [0, '13:00', 90, 'Review vendor CCTV', 'B', 'Alphin Santoso H.'],
  [1, '08:30', 60, 'Briefing produksi', 'C', 'Nur Ayni'], [1, '10:00', 120, 'Training Oracle K2', 'A', 'Beny Saputra'], [1, '14:00', 60, 'Interview kandidat', 'B', 'Merda Della Sovira'],
  [2, '09:00', 90, 'Rapat Finance bulanan', 'A', 'Maria Yuliani Br Purba'], [2, '11:00', 60, 'Sync Web Dev', 'B', 'RM Bagastyo Anggoro', true], [2, '13:30', 60, 'Demo iDesk ke HSE', 'C', 'RM Bagastyo Anggoro', true],
  [3, '10:00', 60, 'Onboarding karyawan baru', 'A', 'Shanon Maria'], [3, '15:00', 90, 'Evaluasi supplier', 'C', 'Tjan Siauw Hwa'],
  [4, '09:00', 240, 'Diblokir · maintenance akun', 'B', 'Admin', false, true], [4, '13:00', 60, 'Town hall site SPJ', 'A', 'GA Management'],
];
const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmt = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}.${String(m % 60).padStart(2, '0')}`;
let filter = { acc: 'all', mine: false, q: '' };
function weekView() {
  const times = Array.from({ length: SLOTS }, (_, i) => `<span>${i % 2 ? '' : fmt((START_HOUR * 60) + i * SLOT_MIN)}</span>`).join('');
  const heads = `<div class="dh" style="border-left:0"></div>${DAYS.map(([d, n], i) => `<div class="dh${i === TODAY ? ' today' : ''}">${d}<b>${i === TODAY ? `<span>${n}</span>` : n}</b></div>`).join('')}`;
  const cols = DAYS.map((_, di) => {
    const bks = BOOKINGS.filter((b) => b[0] === di).filter((b) => (filter.acc === 'all' || b[4] === filter.acc) && (!filter.mine || b[6]) && (!filter.q || b[3].toLowerCase().includes(filter.q)));
    const cards = bks.map(([, st, dur, title, acc, by, mine, blocked]) => { const s = toMin(st); return `<button class="bk${mine ? ' mine' : ''}${blocked ? ' blocked' : ''}" style="--c:${ACC[acc][1]};--t:${((s - START_HOUR * 60) / SLOT_MIN) * SLOT_PX + 1}px;--hgt:${(dur / SLOT_MIN) * SLOT_PX - 3}px" data-tip="${title}\n${fmt(s)} – ${fmt(s + dur)}\nAkun: ${ACC[acc][0]}\nBooked by: ${by}" data-meet="${title}|${fmt(s)} – ${fmt(s + dur)}|${ACC[acc][0]}|${by}"><span class="acc">${ACC[acc][0]}</span><small>${fmt(s)}</small><b>${title}</b>${dur >= 60 ? `<small>${by}</small>` : ''}</button>`; }).join('');
    const now = di === TODAY ? `<span class="now-line" style="--t:${((12 * 60 + 40 - START_HOUR * 60) / SLOT_MIN) * SLOT_PX}px" aria-label="Sekarang 12.40"></span>` : '';
    return `<div class="day${di === TODAY ? ' today' : ''}" data-day="${di}">${Array.from({ length: SLOTS }, () => '<i class="slot-free"></i>').join('')}${cards}${now}</div>`;
  }).join('');
  return `<div class="cal-wrap"><div class="cal">${heads}<div class="times">${times}</div>${cols}</div></div>`;
}
function matrix() {
  const cell = (acc, di) => BOOKINGS.filter((b) => b[0] === di && b[4] === acc).map((b) => `<span style="--c:${ACC[acc][1]}" title="${b[3]}">${b[1].replace(':', '.')} ${b[3]}</span>`).join('') || '<small class="muted">Kosong</small>';
  return `<div class="cal-wrap"><div class="matrix"><div class="mh" style="border-left:0">Akun</div>${DAYS.map(([d, n]) => `<div class="mh">${d} ${n}</div>`).join('')}
    ${Object.entries(ACC).map(([k, [n, c]]) => `<div class="ma" style="--c:${c}"><i></i>${n}</div>${DAYS.map((_, di) => `<div class="mc">${cell(k, di)}</div>`).join('')}`).join('')}</div></div>`;
}
function mine() {
  const list = BOOKINGS.filter((b) => b[6]);
  return `<div class="list">${list.map(([di, st, dur, title, acc]) => `<button class="li" data-meet="${title}|${st.replace(':', '.')} – ${fmt(toMin(st) + dur)}|${ACC[acc][0]}|Anda"><span class="ico" style="--c:${ACC[acc][1]}">${ic('video')}</span><div class="grow1"><b>${title}</b><small>${DAYS[di][0]}, ${DAYS[di][1]} Okt · ${st.replace(':', '.')} – ${fmt(toMin(st) + dur)} · ${ACC[acc][0]}</small></div>${di === TODAY ? bub('Hari ini', 'var(--accent)', { ink: 'var(--accent)' }) : ''}</button>`).join('')}</div>`;
}
const UPCOMING = BOOKINGS.filter((b) => b[0] === TODAY && toMin(b[1]) >= 12 * 60).concat(BOOKINGS.filter((b) => b[0] === TODAY + 1));

iDeskPages.mount(`
<main class="content page">
  <div class="head">
    <span class="tile ptile" style="--c:var(--blue)">${ic('video')}</span>
    <div><h2>Zoom Calendar</h2><p>Booking ruang meeting Zoom untuk 3 akun perusahaan</p></div>
    <span class="spacer"></span>
    <div class="head-actions">
      <button class="btn primary" id="bookBtn">${ic('calendar-plus')}Book Meeting</button>
    </div>
  </div>
  <div class="filters">
    <button class="back" aria-label="Minggu sebelumnya" data-demo="Navigasi minggu hanya contoh.">${ic('chevron-left')}</button>
    <button class="btn" data-demo="Sudah di minggu ini.">Today</button>
    <button class="back" aria-label="Minggu berikutnya" data-demo="Navigasi minggu hanya contoh.">${ic('chevron-right')}</button>
    <b style="font:650 15px var(--font-display);margin:0 6px">19 – 23 Oktober 2026</b>
    <div class="seg" data-tabs="zPanels" aria-label="Mode tampilan"><button data-tab="week" class="on">${ic('calendar-days')}Minggu</button><button data-tab="matrix">${ic('grid-3x3')}Matriks Semua Akun</button><button data-tab="mine">${ic('user-round')}Bookingan Saya</button></div>
    <label class="field" style="max-width:260px">${ic('search')}<input id="zq" placeholder="Cari meeting…" aria-label="Cari meeting"></label>
    <button class="pop" id="zAcc"><span class="k">Akun</span><span class="v">Semua Akun Zoom (3)</span>${caret}</button>
    <button class="pop" id="zMine" aria-pressed="false" title="Hanya tampilkan meeting milik Anda di kalender mingguan">${ic('user-round-check')}<span class="v">Hanya Meeting Saya</span></button>
  </div>
  <div class="chart-legend" style="margin:0 2px 10px">${Object.values(ACC).map(([n, c]) => `<span style="--c:${c}"><i></i>${n}</span>`).join('')}<span style="--c:var(--surface)"><i style="box-shadow:inset 0 0 0 1.5px var(--accent)"></i>Booking saya</span><span><i style="background:repeating-linear-gradient(135deg,var(--fill-2) 0 3px,transparent 3px 6px)"></i>Diblokir</span></div>
  <div class="grid-main" style="grid-template-columns:minmax(0,1fr) 300px">
    <section class="panel" style="padding:0;overflow:hidden" id="zPanels">
      <div class="tab-panel" data-panel="week"><div id="zWeek">${weekView()}</div></div>
      <div class="tab-panel" data-panel="matrix" hidden>${matrix()}</div>
      <div class="tab-panel" data-panel="mine" hidden style="padding:14px 16px">${mine()}</div>
    </section>
    <aside class="stack">
      <section class="panel"><h3>Upcoming Meetings</h3>
        <div class="list">${UPCOMING.map(([di, st, dur, title, acc, by], i) => `<button class="li" data-meet="${title}|${st.replace(':', '.')} – ${fmt(toMin(st) + dur)}|${ACC[acc][0]}|${by}"><span class="pdot" style="--c:${ACC[acc][1]}"></span><div class="grow1"><b>${title}</b><small>${di === TODAY ? 'Hari ini' : 'Besok'} · ${st.replace(':', '.')} · ${ACC[acc][0]}</small></div>${i === 0 ? '<span class="bub" style="--c:var(--accent);--ink:var(--accent);height:20px;font-size:10.5px">NEXT</span>' : ''}</button>`).join('')}</div>
      </section>
      <section class="panel"><h3>Akun Zoom</h3>
        ${Object.values(ACC).map(([n, c], i) => `<div class="setting"><span class="pdot" style="width:10px;height:10px;border-radius:50%;background:${c}"></span><div><b>${n}</b><small>${['3', '4', '3'][i]} booking minggu ini · maks. 300 peserta</small></div></div>`).join('')}
      </section>
    </aside>
  </div>
</main>`);

function rerenderWeek() { document.getElementById('zWeek').innerHTML = weekView(); lucide.createIcons(); }
document.getElementById('zq').addEventListener('input', (e) => { filter = { ...filter, q: e.target.value.trim().toLowerCase() }; rerenderWeek(); });
const mineBtn = document.getElementById('zMine');
mineBtn.onclick = () => { filter = { ...filter, mine: !filter.mine }; mineBtn.setAttribute('aria-pressed', String(filter.mine)); mineBtn.classList.toggle('on', filter.mine); mineBtn.style.background = filter.mine ? 'var(--accent-soft)' : ''; mineBtn.style.color = filter.mine ? 'var(--accent)' : ''; rerenderWeek(); };
iDeskDropdown.bind(document.getElementById('zAcc'), { title: 'Filter akun', options: [{ value: 'all', label: 'Semua Akun Zoom (3)' }, ...Object.entries(ACC).map(([value, [label, color]]) => ({ value, label, color }))], value: () => filter.acc, onSelect: (v) => { filter = { ...filter, acc: v }; document.querySelector('#zAcc .v').textContent = v === 'all' ? 'Semua Akun Zoom (3)' : ACC[v][0]; rerenderWeek(); } });
document.addEventListener('click', async (e) => {
  const meet = e.target.closest('[data-meet]');
  if (meet) {
    const [title, time, acc, by] = meet.dataset.meet.split('|');
    await iDeskDropdown.confirm({ title, description: `${time} · ${acc} · Booked by ${by}. Meeting ID dan passcode contoh tidak ditampilkan; tautan Zoom tersedia setelah meeting dibuat di produksi.`, confirmLabel: 'Tutup' });
    return;
  }
  if (e.target.closest('.slot-free') || e.target.id === 'bookBtn' || e.target.closest('#bookBtn')) {
    iDeskDropdown.notice('Form booking (judul, akun, durasi, peserta) belum dibuat di mockup; tidak ada meeting yang dibuat.');
  }
});
</script>
</body>
</html>
