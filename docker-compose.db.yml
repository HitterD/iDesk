# Development Docker Compose - PostgreSQL + Redis only
# Run: docker-compose -f docker-compose.db.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: idesk-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set and non-empty}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set and non-empty}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set and non-empty}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./backups/postgres:/var/lib/postgresql/data
    networks:
      - idesk-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: idesk-redis
    # Development override: port is published on purpose so the host-side backend
    # can reach Redis. Password is still required so dev matches production auth.
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}
    command: >
      redis-server --appendonly yes
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}"
    volumes:
      - ./backups/redis:/data
    networks:
      - idesk-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  idesk-network:
    driver: bridge
