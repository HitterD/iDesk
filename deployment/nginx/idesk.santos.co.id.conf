# ==============================================================================
# Nginx Reverse Proxy Configuration for iDesk Production
# Domain: idesk.santos.co.id
# Target: 192.168.2.136:3080 (Coolify iDesk Frontend + Internal Backend Gateway)
# ==============================================================================

# HTTP - Redirect all traffic to HTTPS (Optional jika menggunakan SSL)
server {
    listen 80;
    listen [::]:80;
    server_name idesk.santos.co.id;

    # Jika ingin redirect otomatis ke HTTPS:
    # return 301 https://$host$request_uri;

    # Jika sementara belum menggunakan SSL (HTTP only):
    include /etc/nginx/conf.d/idesk-locations.conf;
}

# HTTPS Configuration (Direkomendasikan untuk Production)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name idesk.santos.co.id;

    # SSL Certificates (Sesuaikan path sertifikat Anda)
    # ssl_certificate /etc/letsencrypt/live/idesk.santos.co.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/idesk.santos.co.id/privkey.pem;

    # SSL Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum upload size for attachments, documents, and backups
    client_max_body_size 100M;

    # Upstream proxy passing to Coolify iDesk stack
    location / {
        proxy_pass http://192.168.2.136:3080;
        proxy_http_version 1.1;

        # WebSocket support (Crucial for real-time notifications, chat, and status updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout settings for long-running reports and heavy sync
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffer tuning
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
