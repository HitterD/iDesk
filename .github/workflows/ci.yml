name: CI

# Tests on every PR and push to main. The image build (deploy-ghcr.yml) does not run
# tests, so a regression could reach prod unchecked; this gate catches it first.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (types, unit tests, SQL integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: idesk
          POSTGRES_PASSWORD: idesk
          POSTGRES_DB: idesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U idesk -d idesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        # jest.ci.config.js: transpile only (types are checked by the step above).
        run: npx jest --runInBand -c jest.ci.config.js
      # SQL that mocked repositories cannot check, run on a real Postgres. These specs
      # build their own TEMP tables, so they need no migrated schema. (The full
      # migration chain cannot start from an empty database: the base tables predate it.)
      - name: SQL integration tests
        env:
          TEST_DATABASE_URL: postgres://idesk:idesk@localhost:5432/idesk_test
        run: npx jest --runInBand -c jest.ci.config.js src/modules/hardware-request/services/request-number.integration.spec.ts src/modules/notifications/notification-visible-note.integration.spec.ts src/modules/ticketing/utils/ticket-number-generator.integration.spec.ts src/modules/ticketing/utils/ticket-number-guard.integration.spec.ts

  frontend:
    name: Frontend (types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint (errors fail; warnings capped at the existing debt)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
