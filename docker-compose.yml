# Production Docker Compose - Full Stack
# Run: docker-compose up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: idesk-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-idesk_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./backups/postgres:/var/lib/postgresql/data
    networks:
      - idesk-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: idesk-redis
    # No host port: Redis holds refresh-session security state and is reachable
    # only through the internal idesk-network.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}
    command: >
      redis-server --appendonly yes --maxmemory-policy noeviction
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}"
    volumes:
      - ./backups/redis:/data
    networks:
      - idesk-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: idesk-backend
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-idesk_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-60m}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}
      PORT: 5050
      AUTH_REFRESH_SESSION_MODE: ${AUTH_REFRESH_SESSION_MODE:-legacy}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - "5050:5050"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:5050/v1/health/live >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - idesk-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: idesk-frontend
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - idesk-network

networks:
  idesk-network:
    driver: bridge
